<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle ROV</title>
    <script src="https://jsmpeg.com/jsmpeg.min.js"></script>
    <style>
        body {
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        /* --- CADRE VIDÉO AGRANDI --- */
        .video-wrapper {
            margin: 0 auto 20px auto;
            border: 3px solid #555;
            background-color: #000;
            width: 960px; /* Taille agrandie */
            height: 540px; /* Ratio 16:9 respecté */
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.8);
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        
        /* --- BARRE DE TÉLÉMÉTRIE --- */
        .telemetry-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            background: #333;
            padding: 15px;
            border-radius: 8px;
            width: 930px;
            margin: 0 auto;
        }
        .data-box {
            font-size: 1.2em;
        }
        .data-box span {
            font-weight: bold;
            color: #00ffcc;
        }
        #status {
            margin-top: 15px;
            font-style: italic;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h2>Caméra ROV Principale</h2>

    <div class="video-wrapper">
        <canvas id="video-canvas"></canvas>
    </div>

    <div class="telemetry-bar">
        <div class="data-box">Temp: <span id="temp-val">--</span></div>
        <div class="data-box">Hum: <span id="hum-val">--</span></div>
        <div class="data-box">Accel X: <span id="accelx-val">--</span></div>
        <div class="data-box">Accel Y: <span id="accely-val">--</span></div>
        <div class="data-box">Moteur: <span id="motor-val">--</span></div>
        <div class="data-box">Conso: <span id="amps-val">--</span></div>
    </div>

    <div id="status">Attente de connexion...</div>

    <script>
        // 1. Lancement de la Vidéo
        var canvas = document.getElementById('video-canvas');
        var urlVideo = 'wss://rov-ptaa.onrender.com/ws/video';
        var player = new JSMpeg.Player(urlVideo, { canvas: canvas, autoplay: true, audio: false });

        // 2. Lancement des Données
        var urlTelemetry = 'wss://rov-ptaa.onrender.com/ws';
        var ws = new WebSocket(urlTelemetry);
        var statusDiv = document.getElementById('status');

        ws.onopen = function() { statusDiv.innerText = "Connecté au serveur Render ! En attente de la Raspberry..."; };
        ws.onclose = function() { statusDiv.innerText = "Déconnecté. Reconnexion..."; };

        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.telemetry) {
                    document.getElementById('temp-val').innerText = data.telemetry.temperature + " °C";
                    document.getElementById('hum-val').innerText = data.telemetry.humidity + " %";
                    document.getElementById('accelx-val').innerText = data.telemetry.accel_x + " g";
                    document.getElementById('accely-val').innerText = data.telemetry.accel_y + " g";
                    document.getElementById('motor-val').innerText = data.telemetry.motor + " µs";
                    document.getElementById('amps-val').innerText = data.telemetry.amps + " A";
                    statusDiv.innerText = "Données reçues en direct !";
                }
            } catch (e) {
                console.log("Erreur JSON:", e);
            }
        };
    </script>
</body>
</html>

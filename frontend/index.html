<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROV PS4 COCKPIT</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --ps-blue: #003791;
            --neon-green: #39ff14;
            --neon-red: #ff0044;
            --bg-dark: #0a0b10;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #header {
            padding: 10px;
            background: linear-gradient(90deg, transparent, var(--ps-blue), transparent);
            border-bottom: 1px solid var(--neon-blue);
            text-align: center;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
        }

        #main-container {
            display: flex;
            flex: 1;
            padding: 15px;
            gap: 15px;
            box-sizing: border-box;
        }

        #video-section {
            flex: 3;
            position: relative;
            background: #000;
            border: 2px solid #333;
            border-radius: 15px;
            overflow: hidden;
        }

        #video-canvas { width: 100%; height: 100%; object-fit: contain; }

        /* --- STYLISATION DE LA MANETTE PS4 --- */
        #sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 280px;
        }

        .controller-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 1px solid #333;
        }

        /* SVG Manette */
        #ps4-svg {
            width: 100%;
            height: auto;
            max-width: 250px;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
        }

        .ps-btn { fill: #333; transition: fill 0.1s; }
        .ps-btn-active { fill: var(--neon-blue) !important; filter: blur(1px); }
        .ps-stick { fill: #222; stroke: #444; stroke-width: 1; }
        
        /* Symboles PS4 colors */
        .btn-cross.ps-btn-active { fill: #5a78ff !important; }
        .btn-circle.ps-btn-active { fill: #ff5a5a !important; }
        .btn-square.ps-btn-active { fill: #ff7ade !important; }
        .btn-triangle.ps-btn-active { fill: #00e676 !important; }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid var(--neon-blue);
            padding: 10px;
            border-radius: 5px;
        }

        .stat-value { font-size: 1.4em; color: var(--neon-green); font-family: monospace; }
        .stat-label { color: #888; font-size: 0.7em; text-transform: uppercase; }

    </style>
</head>
<body>

<div id="header">DUALSHOCK 4 CONTROL INTERFACE</div>

<div id="main-container">
    <div id="video-section">
        <canvas id="video-canvas"></canvas>
    </div>

    <div id="sidebar">
        <div class="controller-card">
            <div class="stat-label" style="margin-bottom:10px;">DualShock 4 Status</div>
            <svg id="ps4-svg" viewBox="0 0 200 150">
                <path d="M50,40 Q20,40 20,80 Q20,130 50,130 Q70,130 80,110 L120,110 Q130,130 150,130 Q180,130 180,80 Q180,40 150,40 Z" fill="#1a1a1a"/>
                <rect x="70" y="45" width="60" height="35" rx="5" fill="#2a2a2a" id="ps-touchpad"/>
                
                <circle cx="70" cy="100" r="15" fill="#111"/>
                <circle id="stick-l" cx="70" cy="100" r="10" class="ps-stick"/>
                
                <circle cx="130" cy="100" r="15" fill="#111"/>
                <circle id="stick-r" cx="130" cy="100" r="10" class="ps-stick"/>

                <circle id="btn-0" class="ps-btn btn-cross" cx="155" cy="95" r="6"/> <circle id="btn-1" class="ps-btn btn-circle" cx="170" cy="80" r="6"/> <circle id="btn-2" class="ps-btn btn-square" cx="140" cy="80" r="6"/> <circle id="btn-3" class="ps-btn btn-triangle" cx="155" cy="65" r="6"/> <rect id="btn-12" class="ps-btn" x="42" y="74" width="6" height="12" rx="1"/> <rect id="btn-13" class="ps-btn" x="42" y="94" width="6" height="12" rx="1"/> </svg>
            <div id="gp-name" style="font-size: 0.8em; color: var(--neon-blue); margin-top: 10px;">Connectez une manette...</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">⚡ Consommation</div>
            <div id="amp-val" class="stat-value">0.00 A</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">🌡️ Température</div>
            <div id="temp-val" class="stat-value">-- °C</div>
        </div>
    </div>
</div>

<script src="/frontend/jsmpeg.min.js"></script>
<script>
    const host = window.location.host;
    const wsProto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    
    // Initialisation Vidéo
    const canvas = document.getElementById('video-canvas');
    const player = new JSMpeg.Player(wsProto + host + '/ws/video', { canvas: canvas, autoplay: true });

    // Gestion de la Manette PS4
    function updateGamepad() {
        const gamepads = navigator.getGamepads();
        const gp = gamepads[0];

        if (gp) {
            document.getElementById('gp-name').innerText = "PS4 CONTROLLER ACTIVE";
            
            // Animation Joysticks (Axes 0,1 et 2,3)
            const sL = document.getElementById('stick-l');
            sL.setAttribute('cx', 70 + (gp.axes[0] * 8));
            sL.setAttribute('cy', 100 + (gp.axes[1] * 8));

            const sR = document.getElementById('stick-r');
            sR.setAttribute('cx', 130 + (gp.axes[2] * 8));
            sR.setAttribute('cy', 100 + (gp.axes[3] * 8));

            // Animation Boutons (0: Croix, 1: Cercle, 2: Carré, 3: Triangle)
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`btn-${i}`);
                if (gp.buttons[i].pressed) btn.classList.add('ps-btn-active');
                else btn.classList.remove('ps-btn-active');
            }
            
            // D-Pad
            [12, 13].forEach(i => {
                const btn = document.getElementById(`btn-${i}`);
                if (gp.buttons[i].pressed) btn.classList.add('ps-btn-active');
                else btn.classList.remove('ps-btn-active');
            });
        }
        requestAnimationFrame(updateGamepad);
    }

    window.addEventListener("gamepadconnected", () => {
        console.log("Manette détectée");
        updateGamepad();
    });

    // Connexion télémétrie (Websocket)
    const wsTele = new WebSocket(wsProto + host + '/ws');
    wsTele.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.telemetry) {
            document.getElementById('amp-val').innerText = data.telemetry.amps.toFixed(2) + " A";
            document.getElementById('temp-val').innerText = data.telemetry.temperature + " °C";
        }
    };
</script>
</body>
</html>

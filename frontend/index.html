<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROV COMMAND CENTER - PRO</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --ps-blue: #003791;
            --neon-green: #39ff14;
            --neon-red: #ff0044;
            --bg-dark: #0a0b10;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            overflow: hidden; /* Désactivé par défaut pour le cockpit */
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* --- SYSTÈME DE MOT DE PASSE (OVERLAY) --- */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .auth-box {
            background: rgba(0, 242, 255, 0.05);
            padding: 40px;
            border: 2px solid var(--neon-blue);
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .auth-box input {
            background: black;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 15px;
            font-size: 1.2em;
            text-align: center;
            margin: 20px 0;
            border-radius: 5px;
            outline: none;
        }

        .auth-box button {
            background: var(--neon-blue);
            color: black;
            border: none;
            padding: 10px 30px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* --- INTERFACE (Cachée au début) --- */
        #ui-wrapper {
            display: none; /* Apparaît après le MDP */
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        #header {
            padding: 10px;
            background: rgba(0, 242, 255, 0.1);
            border-bottom: 1px solid var(--neon-blue);
            text-align: center;
            letter-spacing: 2px;
            color: var(--neon-blue);
            font-weight: bold;
            text-transform: uppercase;
        }

        #main-container {
            display: flex;
            height: calc(100vh - 50px);
            padding: 15px; gap: 15px; box-sizing: border-box;
        }

        #video-section {
            flex: 3; position: relative; background: #000;
            border: 2px solid #333; border-radius: 8px; overflow: hidden;
        }

        #video-canvas { width: 100%; height: 100%; object-fit: contain; }

        .obstacle-zone {
            position: absolute; display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 5px;
        }
        #obs-up { top: 5%; left: 35%; width: 30%; height: 25px; }
        #obs-down { bottom: 5%; left: 35%; width: 30%; height: 25px; }
        #obs-front-l { top: 30%; left: 5%; width: 15%; height: 40%; }
        #obs-front-c { top: 25%; left: 35%; width: 30%; height: 50%; border: 2px dashed rgba(255,255,255,0.2); }
        #obs-front-r { top: 30%; right: 5%; width: 15%; height: 40%; }
        
        .danger-active { background: rgba(255, 0, 68, 0.7) !important; border: 2px solid var(--neon-red) !important; box-shadow: 0 0 15px var(--neon-red); }

        .stat-card {
            background: rgba(255, 255, 255, 0.05); border: 1px solid #333;
            padding: 12px; border-radius: 8px; border-left: 4px solid var(--neon-blue); margin-bottom: 10px;
        }

        .stat-value { font-size: 1.4em; color: var(--neon-green); font-family: monospace; }
        .stat-label { color: #888; font-size: 0.75em; text-transform: uppercase; }

        /* --- CHAT --- */
        #chat-section { padding: 20px; background: #000; border-top: 2px solid #333; }
        #chat-window { max-width: 800px; margin: 0 auto; height: 250px; background: #111; border: 1px solid #444; display: flex; flex-direction: column; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 10px; }
        .msg { padding: 5px 10px; border-radius: 5px; background: #222; margin-bottom: 5px; width: fit-content; }
        .msg-me { align-self: flex-end; background: var(--ps-blue); }
        #chat-input-area { display: flex; padding: 10px; gap: 5px; }
        #chat-input { flex: 1; background: #000; color: white; border: 1px solid #444; padding: 8px; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-box">
        <h2 style="color: var(--neon-blue);">ACCÈS SÉCURISÉ</h2>
        <p>Entrez le code de mission</p>
        <input type="password" id="mission-code" placeholder="****">
        <br>
        <button onclick="checkAuth()">Connexion</button>
        <p id="auth-error" style="color: var(--neon-red); display:none; margin-top:10px;">CODE INCORRECT</p>
    </div>
</div>

<div id="ui-wrapper">
    <div id="header">
        ROV COMMAND CENTER - <span id="status-indicator">OFFLINE</span>
    </div>

    <div id="main-container">
        <div id="video-section">
            <canvas id="video-canvas"></canvas>
            <div id="obs-up" class="obstacle-zone">UP</div>
            <div id="obs-front-l" class="obstacle-zone">L</div>
            <div id="obs-front-c" class="obstacle-zone">CENTER</div>
            <div id="obs-front-r" class="obstacle-zone">R</div>
            <div id="obs-down" class="obstacle-zone">DOWN</div>
        </div>

        <div id="sidebar">
            <div class="stat-card">
                <div class="stat-label">⚡ Puissance</div>
                <div id="amp-val" class="stat-value">0.00 A</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🌡️ Temp</div>
                <div id="temp-val" class="stat-value">--°C</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">⚓ Pression</div>
                <div id="press-val" class="stat-value">-- hPa</div>
            </div>
        </div>
    </div>

    <div id="chat-section">
        <div id="chat-window">
            <div id="chat-messages"></div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="Message...">
                <button id="chat-send">OK</button>
            </div>
        </div>
    </div>
</div>

<script src="/frontend/jsmpeg.min.js"></script>
<script>
    // --- AUTHENTIFICATION ---
    function checkAuth() {
        const code = document.getElementById('mission-code').value;
        if (code === "robotAA") { // <--- MODIFIE TON CODE ICI
            document.getElementById('auth-overlay').style.opacity = "0";
            setTimeout(() => {
                document.getElementById('auth-overlay').style.display = "none";
                document.getElementById('ui-wrapper').style.display = "flex";
                initSystem(); // Lance la connexion seulement après
            }, 500);
        } else {
            document.getElementById('auth-error').style.display = "block";
        }
    }

    // --- SYSTÈME ROV ---
    function initSystem() {
        const host = window.location.host;
        const wsProto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        
        const player = new JSMpeg.Player(wsProto + host + '/ws/video', {
            canvas: document.getElementById('video-canvas')
        });

        const ws = new WebSocket(wsProto + host + '/ws');
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.telemetry) {
                document.getElementById('amp-val').innerText = data.telemetry.amps + " A";
                document.getElementById('temp-val').innerText = data.telemetry.temperature + "°C";
                document.getElementById('press-val').innerText = data.telemetry.pressure + " hPa";
                // Gestion obstacles...
            }
            if (data.type === 'chat') {
                const div = document.createElement('div');
                div.className = 'msg';
                div.innerText = data.message;
                document.getElementById('chat-messages').appendChild(div);
            }
        };

        document.getElementById('chat-send').onclick = () => {
            const msg = document.getElementById('chat-input').value;
            ws.send(JSON.stringify({type: 'chat', message: msg}));
            document.getElementById('chat-input').value = "";
        };
    }
</script>
</body>
</html>

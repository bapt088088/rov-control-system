<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cockpit ROV PTAA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent: #00bcd4;
            --text-main: #c9d1d9;
            --danger: #ff4444;
            --success: #2ea043;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #30363d;
            padding-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #status-indicator {
            padding: 5px 15px;
            border-radius: 20px;
            background-color: #30363d;
            font-weight: bold;
        }

        .main-container {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        /* --- SECTION VIDÉO (GAUCHE) --- */
        .video-section {
            flex: 3;
            background: var(--panel-bg);
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .video-wrapper {
            flex: 1;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #333;
        }

        /* La nouvelle balise image pour la vidéo ! */
        #video-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* --- SECTION DROITE (TÉLÉMÉTRIE + CHAT) --- */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 300px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .panel h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #8b949e;
            font-size: 0.9em;
            text-transform: uppercase;
            border-bottom: 1px solid #30363d;
            padding-bottom: 5px;
        }

        /* Télémétrie */
        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .data-box {
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .data-label {
            font-size: 0.75em;
            color: #8b949e;
            margin-bottom: 5px;
        }

        .data-value {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--accent);
        }

        /* Chat */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #chat-messages {
            flex: 1;
            background: #0d1117;
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
            max-height: 250px;
            font-size: 0.9em;
        }

        .chat-msg {
            margin-bottom: 8px;
            word-wrap: break-word;
        }

        .chat-msg .user {
            font-weight: bold;
            color: var(--accent);
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        #chat-input {
            flex: 1;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
        }

        #chat-send {
            padding: 8px 15px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        #chat-send:hover {
            background: #008ba3;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Cockpit ROV PTAA</h1>
        <div id="status-indicator" style="color: #8b949e;">🟡 Connexion en cours...</div>
    </div>

    <div class="main-container">
        <div class="video-section">
            <div class="video-wrapper">
                <img id="video-canvas" src="/video_feed" alt="Caméra déconnectée">
            </div>
            <div style="text-align: center; margin-top: 10px; color: #8b949e; font-size: 0.8em;">Flux Vidéo MJPEG Direct</div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <h3>Capteurs & Moteur</h3>
                <div class="telemetry-grid">
                    <div class="data-box">
                        <div class="data-label">TEMPÉRATURE</div>
                        <div class="data-value" id="temp-val">-- °C</div>
                    </div>
                    <div class="data-box">
                        <div class="data-label">HUMIDITÉ</div>
                        <div class="data-value" id="hum-val">-- %</div>
                    </div>
                    <div class="data-box">
                        <div class="data-label">INCLINAISON X</div>
                        <div class="data-value" id="accelx-val">-- g</div>
                    </div>
                    <div class="data-box">
                        <div class="data-label">INCLINAISON Y</div>
                        <div class="data-value" id="accely-val">-- g</div>
                    </div>
                    <div class="data-box">
                        <div class="data-label">SIGNAL MOTEUR</div>
                        <div class="data-value" id="motor-val">1500 µs</div>
                    </div>
                    <div class="data-box">
                        <div class="data-label">COURANT EST.</div>
                        <div class="data-value" id="amps-val">-- A</div>
                    </div>
                </div>
            </div>

            <div class="panel chat-container">
                <h3>Communications</h3>
                <div id="chat-messages">
                    <div class="chat-msg" style="color: #8b949e; font-style: italic;">Système : Canal de communication ouvert.</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Saisir un message..." autocomplete="off">
                    <button id="chat-send">Envoyer</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // SÉCURITÉ : DEMANDE DE MOT DE PASSE
        // ==========================================
        var motDePasse = prompt("🔒 Accès sécurisé : Veuillez entrer le mot de passe du ROV");
        
        if (motDePasse !== "robotAA") {
            document.body.innerHTML = "<h1 style='color: var(--danger); text-align: center; margin-top: 20%; font-size: 3em;'>⛔ ACCÈS REFUSÉ</h1>";
            throw new Error("Accès bloqué : Mauvais mot de passe.");
        }

        // --- GESTION TÉLÉMÉTRIE & CHAT ---
        var socket = io(); 
        var statusIndicator = document.getElementById('status-indicator');
        var chatMessages = document.getElementById('chat-messages');
        var myUsername = "Pilote_" + Math.floor(Math.random() * 1000);

        // Connexion
        socket.on('connect', function() { 
            statusIndicator.innerText = "🟢 SYSTÈME EN LIGNE"; 
            statusIndicator.style.color = "var(--success)";
        });
        
        // Déconnexion
        socket.on('disconnect', function() { 
            statusIndicator.innerText = "🔴 DÉCONNECTÉ"; 
            statusIndicator.style.color = "var(--danger)";
        });

        // Température & Humidité
        socket.on('dht_data', function(data) {
            document.getElementById('temp-val').innerText = data.temp + " °C";
            document.getElementById('hum-val').innerText = data.hum + " %";
        });

        // Inclinaison
        socket.on('mpu_data', function(data) {
            document.getElementById('accelx-val').innerText = data.ax + " g";
            document.getElementById('accely-val').innerText = data.ay + " g";
        });

        // Chat
        function addChatMessage(user, text) {
            var msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg';
            msgDiv.innerHTML = '<span class="user">' + user + ' : </span>' + text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage() {
            var input = document.getElementById('chat-input');
            var text = input.value.trim();
            if (text !== "") {
                addChatMessage(myUsername, text);
                input.value = "";
            }
        }

        document.getElementById('chat-send').addEventListener('click', sendMessage);
        document.getElementById('chat-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>

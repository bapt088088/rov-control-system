<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface de Contrôle ROV</title>
    <script src="https://jsmpeg.com/jsmpeg.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #00bcd4;
            margin-bottom: 20px;
        }

        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        /* --- SECTION VIDÉO --- */
        .video-container {
            background-color: #1e1e1e;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            border: 2px solid #333;
        }

        canvas {
            width: 640px;
            height: 360px;
            background-color: #000;
            border-radius: 5px;
        }

        /* --- SECTION TÉLÉMÉTRIE --- */
        .telemetry-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            border: 2px solid #333;
        }

        .stat-card {
            background-color: #2c2c2c;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            min-width: 120px;
        }

        .stat-card h3 {
            margin: 0;
            font-size: 0.9em;
            color: #888;
            text-transform: uppercase;
        }

        .stat-card p {
            margin: 10px 0 0 0;
            font-size: 1.5em;
            font-weight: bold;
            color: #00bcd4;
        }

        .status {
            margin-top: 20px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>Tableau de Bord ROV 🚀</h1>

    <div class="dashboard">
        <div class="video-container">
            <canvas id="video-canvas"></canvas>
            <div style="text-align: center; margin-top: 10px; color: #aaa;">Caméra Principale (En direct)</div>
        </div>

        <div class="telemetry-container">
            <div class="stat-card">
                <h3>Température (DHT22)</h3>
                <p id="temp-val">-- °C</p>
            </div>
            <div class="stat-card">
                <h3>Humidité (DHT22)</h3>
                <p id="hum-val">-- %</p>
            </div>
            <div class="stat-card">
                <h3>Inclinaison X (MPU)</h3>
                <p id="accelx-val">-- g</p>
            </div>
            <div class="stat-card">
                <h3>Inclinaison Y (MPU)</h3>
                <p id="accely-val">-- g</p>
            </div>
            <div class="stat-card">
                <h3>Vitesse Moteur</h3>
                <p id="motor-val">1500 µs</p>
            </div>
            <div class="stat-card">
                <h3>Consommation (Est.)</h3>
                <p id="amps-val">0.0 A</p>
            </div>
        </div>
    </div>

    <div class="status" id="connection-status">Connexion en cours...</div>

    <script>
        // ==========================================
        // 1. GESTION DU FLUX VIDÉO (JSMPEG)
        // ==========================================
        var canvas = document.getElementById('video-canvas');
        var urlVideo = 'wss://rov-ptaa.onrender.com/ws/video';
        
        // Initialisation du lecteur vidéo
        var player = new JSMpeg.Player(urlVideo, {
            canvas: canvas,
            autoplay: true,
            audio: false,
            onPlay: () => console.log("Vidéo démarrée !"),
            onStalled: () => console.log("Attente de la vidéo...")
        });

        // ==========================================
        // 2. GESTION DE LA TÉLÉMÉTRIE ET DES CAPTEURS
        // ==========================================
        var urlTelemetry = 'wss://rov-ptaa.onrender.com/ws';
        var ws = new WebSocket(urlTelemetry);
        var statusText = document.getElementById('connection-status');

        ws.onopen = function() {
            console.log("Connecté au serveur de télémétrie");
            statusText.innerText = "🟢 Connecté aux capteurs et à la vidéo";
            statusText.style.color = "#4CAF50";
        };

        ws.onclose = function() {
            statusText.innerText = "🔴 Déconnecté du serveur. Reconnexion...";
            statusText.style.color = "#F44336";
        };

        ws.onmessage = function(event) {
            // On réceptionne le paquet JSON envoyé par le Python
            try {
                var data = JSON.parse(event.data);
                
                if (data.telemetry) {
                    // Mise à jour de toutes les cases avec les vraies valeurs des capteurs !
                    document.getElementById('temp-val').innerText = data.telemetry.temperature + " °C";
                    document.getElementById('hum-val').innerText = data.telemetry.humidity + " %";
                    document.getElementById('accelx-val').innerText = data.telemetry.accel_x + " g";
                    document.getElementById('accely-val').innerText = data.telemetry.accel_y + " g";
                    document.getElementById('motor-val').innerText = data.telemetry.motor + " µs";
                    document.getElementById('amps-val').innerText = data.telemetry.amps + " A";
                }
            } catch (e) {
                console.log("Erreur de lecture JSON: ", e);
            }
        };
    </script>
</body>
</html>

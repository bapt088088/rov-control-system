<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROV COMMAND CENTER - FULL ACCESS</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --ps-blue: #003791;
            --neon-green: #39ff14;
            --neon-red: #ff0044;
            --bg-dark: #0a0b10;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            overflow-y: auto; /* Permet le défilement vers le bas */
        }

        #header {
            padding: 15px;
            background: linear-gradient(90deg, transparent, var(--ps-blue), transparent);
            border-bottom: 1px solid var(--neon-blue);
            text-align: center;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* --- SECTION PRINCIPALE (HAUT) --- */
        #top-section {
            display: flex;
            height: calc(100vh - 60px); /* Prend toute la place restante de l'écran */
            padding: 15px;
            gap: 15px;
            box-sizing: border-box;
        }

        #video-container {
            flex: 3;
            position: relative;
            background: #000;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
        }

        #video-canvas { width: 100%; height: 100%; object-fit: contain; }

        #sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 280px;
        }

        /* --- SECTION CHAT (BAS) --- */
        #bottom-section {
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-top: 2px solid #333;
        }

        #chat-window {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            height: 400px;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg { padding: 8px 12px; border-radius: 8px; background: #222; width: fit-content; }
        .msg-me { align-self: flex-end; background: var(--ps-blue); }

        #chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #333;
        }

        #chat-input {
            flex: 1;
            background: #111;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 5px;
            outline: none;
        }

        #chat-send {
            background: var(--neon-blue);
            color: black;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- RESTE DU STYLE (HUD & STATS) --- */
        .stat-card { background: rgba(255, 255, 255, 0.05); border-left: 4px solid var(--neon-blue); padding: 12px; border-radius: 8px; }
        .stat-label { color: #888; font-size: 0.7em; text-transform: uppercase; }
        .stat-value { font-size: 1.4em; color: var(--neon-green); font-family: monospace; }
        .ps4-visual-box { position: relative; width: 220px; height: 140px; margin: 5px auto; background: url('https://raw.githubusercontent.com/Anis-V/Gamepad-API-Tester/master/img/ds4.png') no-repeat center; background-size: contain; }
        .v-stick { position: absolute; width: 26px; height: 26px; background: radial-gradient(#444, #111); border-radius: 50%; top: 80px; }
        #v-stick-l { left: 68px; } #v-stick-r { left: 125px; }
        .v-btn { position: absolute; width: 16px; height: 16px; border-radius: 50%; }
        #v-btn-0 { top: 78px; left: 163px; } /* Cross */
    </style>
</head>
<body>

<div id="header">MISSION CONTROL - ROV PROJECT</div>

<div id="top-section">
    <div id="video-container">
        <canvas id="video-canvas"></canvas>
    </div>

    <div id="sidebar">
        <div class="stat-card">
            <div class="stat-label">Statut Manette PS4</div>
            <div class="ps4-visual-box">
                <div id="v-stick-l" class="v-stick"></div>
                <div id="v-stick-r" class="v-stick"></div>
                <div id="v-btn-0" class="v-btn"></div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-label">⚡ Courant</div>
            <div id="amp-val" class="stat-value">0.00 A</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">🌡️ Température</div>
            <div id="temp-val" class="stat-value">-- °C</div>
        </div>
    </div>
</div>

<div id="bottom-section">
    <h3 style="text-align: center; color: var(--neon-blue);">COMMUNICATION DE MISSION</h3>
    <div id="chat-window">
        <div id="chat-messages">
            <div class="msg">Système : Terminal de communication activé.</div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Notez une observation ou discutez...">
            <button id="chat-send">ENVOYER</button>
        </div>
    </div>
</div>

<script src="/frontend/jsmpeg.min.js"></script>
<script>
    const host = window.location.host;
    const proto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    
    // 1. Vidéo
    new JSMpeg.Player(proto + host + '/ws/video', { canvas: document.getElementById('video-canvas'), autoplay: true });

    // 2. WebSocket Unique pour Télémétrie + Chat
    const ws = new WebSocket(proto + host + '/ws');

    ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        
        // Gérer la télémétrie
        if (data.telemetry) {
            document.getElementById('amp-val').innerText = data.telemetry.amps.toFixed(2) + " A";
            document.getElementById('temp-val').innerText = data.telemetry.temperature + " °C";
        }
        
        // Gérer le chat (quand les autres parlent)
        if (data.type === 'chat') {
            addMessage(data.user + ": " + data.message, false);
        }
    };

    // 3. Logique du Chat
    const chatInput = document.getElementById('chat-input');
    const chatBox = document.getElementById('chat-messages');

    function addMessage(text, isMe) {
        const div = document.createElement('div');
        div.className = isMe ? 'msg msg-me' : 'msg';
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById('chat-send').onclick = () => {
        const txt = chatInput.value;
        if(txt) {
            ws.send(JSON.stringify({ type: 'chat', message: txt }));
            addMessage("Moi: " + txt, true);
            chatInput.value = "";
        }
    };

    // 4. Manette PS4
    function updateGamepad() {
        const gp = navigator.getGamepads()[0];
        if (gp) {
            document.getElementById('v-stick-l').style.transform = `translate(${gp.axes[0]*10}px, ${gp.axes[1]*10}px)`;
            document.getElementById('v-stick-r').style.transform = `translate(${gp.axes[2]*10}px, ${gp.axes[3]*10}px)`;
            const btnCross = document.getElementById('v-btn-0');
            if (gp.buttons[0].pressed) {
                btnCross.style.background = "#5a78ff";
                btnCross.style.boxShadow = "0 0 10px #5a78ff";
            } else {
                btnCross.style.background = "transparent";
                btnCross.style.boxShadow = "none";
            }
        }
        requestAnimationFrame(updateGamepad);
    }
    window.addEventListener("gamepadconnected", updateGamepad);
</script>
</body>
</html>
